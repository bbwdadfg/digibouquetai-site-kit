[package]
name = "digibouquetai-site-kit"
version = "0.1.1"
edition = "2021"
description = "Canonical URL helpers for DigiBouquet AI digital bouquets and AI gift cards."
license = "MIT"
homepage = "https://digibouquetai.com"
repository = "https://github.com/bbwdadfg/digibouquetai-site-kit"
documentation = "https://docs.rs/digibouquetai-site-kit"
readme = "README.md"
keywords = ["digibouquetai", "bouquet", "gift-card", "flowers", "ai"]
categories = ["web-programming"]
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/rust/src/lib.rs"]

[lib]
name = "digibouquetai_site_kit"
path = "rust/src/lib.rs"
